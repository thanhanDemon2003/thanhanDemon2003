<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-label="Software, AI, games and mathematics connected through THINKER and MINDOO">
<title>Software, AI, games and mathematics connected through THINKER and MINDOO</title>
<defs><linearGradient id="shell" x2="1" y2="1"><stop stop-color="#52665d"/><stop offset="1" stop-color="#172820"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173025" stroke-width=".5"/></pattern></defs>
<style>text{font-family:Consolas,monospace;fill:#e8f5ee}.muted{fill:#9abbab}.mint{fill:#3dffa0}.head{animation:tilt 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}.dot{animation:pulse 1.8s infinite}.flow{stroke-dasharray:6 10;animation:flow 5s linear infinite}@keyframes tilt{0%,35%,100%{transform:rotate(0deg)}55%,75%{transform:rotate(9deg)}}@keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}}@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){.head,.eyes,.dot,.flow{animation:none}}</style>
<rect width="1000" height="395" rx="20" fill="#080f0d"/><rect width="1000" height="395" rx="20" fill="url(#grid)"/>
<text x="40" y="43" font-size="14" letter-spacing="3" class="mint">INSIDE THE LAB / FOUR WAYS TO BUILD</text><path class='flow' d='M500 225L250 110' fill='none' stroke='#3dffa0' opacity='.5'/><rect x='150' y='82' width='200' height='74' rx='14' fill='#102219' stroke='#365747'/><text x='250' y='110' text-anchor='middle' font-size='20'>SOFTWARE</text><text x='250' y='135' text-anchor='middle' font-size='13' class='muted'>make it reliable</text><path class='flow' d='M500 225L750 110' fill='none' stroke='#3dffa0' opacity='.5'/><rect x='650' y='82' width='200' height='74' rx='14' fill='#102219' stroke='#365747'/><text x='750' y='110' text-anchor='middle' font-size='20'>AI</text><text x='750' y='135' text-anchor='middle' font-size='13' class='muted'>make it learn</text><path class='flow' d='M500 225L250 300' fill='none' stroke='#3dffa0' opacity='.5'/><rect x='150' y='272' width='200' height='74' rx='14' fill='#102219' stroke='#365747'/><text x='250' y='300' text-anchor='middle' font-size='20'>GAMES</text><text x='250' y='325' text-anchor='middle' font-size='13' class='muted'>make it alive</text><path class='flow' d='M500 225L750 300' fill='none' stroke='#3dffa0' opacity='.5'/><rect x='650' y='272' width='200' height='74' rx='14' fill='#102219' stroke='#365747'/><text x='750' y='300' text-anchor='middle' font-size='20'>MATH</text><text x='750' y='325' text-anchor='middle' font-size='13' class='muted'>understand why</text><rect x="340" y="194" width="320" height="58" rx="29" fill="#102219" stroke="#3dffa0"/><text x="500" y="230" text-anchor="middle" font-size="22">THINKER × MINDOO</text>
